services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: parkflow
      POSTGRES_PASSWORD: parkflow
      POSTGRES_DB: parkflow
    ports:
      # 5434 en el host para no chocar con otros PostgreSQL de la máquina.
      - '5434:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U parkflow -d parkflow']
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    build:
      context: .
      target: worker
    command: npm run db:migrate
    environment:
      DATABASE_URL: postgres://parkflow:parkflow@db:5432/parkflow
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  web:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_MAPTILER_KEY: ${NEXT_PUBLIC_MAPTILER_KEY:-}
        NEXT_PUBLIC_MAPTILER_STYLE: ${NEXT_PUBLIC_MAPTILER_STYLE:-streets-v4}
        NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL:-privacidad@parkflow.example}
    environment:
      HOSTNAME: 0.0.0.0
      DATABASE_URL: postgres://parkflow:parkflow@db:5432/parkflow
      REPORT_SALT: ${REPORT_SALT:-parkflow-dev-salt}
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/health > /dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 6

  ingest:
    build:
      context: .
      target: worker
    command: npm run ingest:watch
    environment:
      DATABASE_URL: postgres://parkflow:parkflow@db:5432/parkflow
      REPORT_SALT: ${REPORT_SALT:-parkflow-dev-salt}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  db-data:
